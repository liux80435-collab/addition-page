<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8ff">
  <title>两个数相加</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f1f5ff;
      color: #172554;
      font-family: system-ui, "Microsoft YaHei", sans-serif;
    }
    main {
      width: min(100%, 520px);
      padding: 28px;
      border-radius: 28px;
      background: white;
      box-shadow: 0 12px 40px #1e3a8a18;
      text-align: center;
    }
    h1 { margin: 0 0 24px; font-size: clamp(30px, 8vw, 42px); }
    .numbers { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
    input {
      width: 100%; min-width: 0; height: 88px;
      border: 3px solid #c7d2fe; border-radius: 18px;
      text-align: center; font-size: 38px; font-weight: 700; color: #172554;
    }
    input:focus { outline: 4px solid #bfdbfe; border-color: #2563eb; }
    .sign { font-size: 42px; font-weight: 800; }
    button {
      width: 100%; min-height: 76px; margin-top: 22px;
      border: 0; border-radius: 18px; background: #2563eb; color: white;
      font-size: 30px; font-weight: 800; cursor: pointer;
    }
    button:active { transform: scale(.98); background: #1d4ed8; }
    #result { min-height: 60px; margin-top: 22px; font-size: clamp(30px, 8vw, 42px); font-weight: 800; }
    #speak { margin-top: 10px; background: #0f766e; font-size: 24px; }
    .hint { margin: 16px 0 0; color: #475569; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>两个数相加</h1>
    <form id="addition-form">
      <div class="numbers">
        <input id="first" type="number" inputmode="numeric" min="10" max="99" placeholder="?" aria-label="第一个两位数" required>
        <span class="sign" aria-hidden="true">+</span>
        <input id="second" type="number" inputmode="numeric" min="10" max="99" placeholder="?" aria-label="第二个两位数" required>
      </div>
      <button type="submit">算一算</button>
    </form>
    <div id="result" aria-live="polite">结果会显示在这里</div>
    <button id="speak" type="button" hidden>🔊 听结果</button>
    <p class="hint">在两个框里填数，再点蓝色按钮。</p>
  </main>
  <script>
    const form = document.querySelector("#addition-form");
    const first = document.querySelector("#first");
    const second = document.querySelector("#second");
    const result = document.querySelector("#result");
    const speakButton = document.querySelector("#speak");
    let spokenResult = "";

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const a = Number(first.value);
      const b = Number(second.value);
      if (!Number.isInteger(a) || !Number.isInteger(b) || a < 10 || a > 99 || b < 10 || b > 99) {
        result.textContent = "请在两个框里填 10 到 99 的数";
        speakButton.hidden = true;
        return;
      }
      const sum = a + b;
      result.textContent = `${a} + ${b} = ${sum}`;
      spokenResult = `${a}加${b}等于${sum}`;
      speakButton.hidden = false;
    });

    speakButton.addEventListener("click", () => {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const message = new SpeechSynthesisUtterance(spokenResult);
        message.lang = "zh-CN";
        window.speechSynthesis.speak(message);
      } else {
        result.textContent = spokenResult;
      }
    });
  </script>
</body>
</html>
